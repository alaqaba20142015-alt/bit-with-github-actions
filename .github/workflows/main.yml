name: Build Debug APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Unzip project
        run: |
          ZIP_FILE="$(ls -1 *.zip | sort | head -n 1)"
          echo "Using ZIP: $ZIP_FILE"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project dir: $PROJECT_DIR"

      - name: Enable AndroidX
        run: |
          cat >> "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          EOF

      - name: Patch Material experimental opt-in
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["PROJECT_DIR"])
          annotation = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n\n"
          for p in root.glob("app/src/main/java/**/*.kt"):
              txt = p.read_text(encoding="utf-8")
              if "ExperimentalMaterial3Api" not in txt:
                  p.write_text(annotation + txt, encoding="utf-8")
          PY

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p output
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)"
          cp "$APK_FILE" output/IkhtibaratiSmartPro-V0.3.2-debug.apk
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IkhtibaratiSmartPro-V0.3.2-debug-apk
          path: output/IkhtibaratiSmartPro-V0.3.2-debug.apk
